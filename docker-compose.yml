# Version Docker Compose
# version: '3.8'
services:
  imaging:
    build: .
    image: imaging
    container_name: imaging
    stdin_open: true  # -i equivalent
    tty: true         # -t equivalent
    environment:
      - DISPLAY=${DISPLAY}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - /home/david/Documents/DATA:/opt/imagingData
      - /home/david/Documents/DATA-2:/opt/processedData
      - /home/david/Documents/imaging:/opt/schain
    sysctls:
      - kernel.shmmax=3593184000
      - kernel.shmall=3593184000
    command: /bin/bash
